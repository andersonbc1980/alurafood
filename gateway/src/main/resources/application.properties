server.port=8082

eureka.client.serviceUrl.defaultZone=http://localhost:8081/eureka

spring.application.name=gateway
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true

#spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
#spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

#PEDIDOS
spring.cloud.gateway.server.webmvc.routes[0].id=pedidos-ms
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://pedidos-ms
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/pedidos-ms/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# PAGAMENTOS
spring.cloud.gateway.server.webmvc.routes[1].id=pagamentos-ms
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://pagamentos-ms
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/pagamentos-ms/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

eureka.instance.prefer-ip-address=true


